name: CI

on:
  push:
    branches-ignore:
      - '^[0-9]+\.[0-9]+\.[0-9]+'
  pull_request:
    branches-ignore:
      - '^[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15", "pypy3"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv self update
          uv sync

      - name: Run tests
        run: uv run pytest -vv --cov --cov-report=html --cov-report=term-missing
